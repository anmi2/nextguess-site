<!doctype html><html lang="ja"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://api.github.com; base-uri 'none'; form-action 'none'"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QUIZ RAID 管理</title><style>
*{box-sizing:border-box}body{font:15px system-ui,sans-serif;margin:0;background:#f5f6f8;color:#17202a}main{max-width:1100px;margin:auto;padding:20px}h1{font-size:22px}nav{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}button,input,select,textarea{font:inherit;padding:9px;border:1px solid #b7bec7;border-radius:5px;background:white}button{cursor:pointer}button.active,#post{background:#253a52;color:white}textarea{width:100%;min-height:90px}input{flex:1;min-width:120px}article{background:white;border:1px solid #d6dae0;padding:14px;margin:8px 0;border-radius:5px;white-space:pre-wrap;overflow-wrap:anywhere}h3{margin:0 0 8px;font-size:16px}small{color:#56616e}p{margin:8px 0}.tools{display:flex;gap:8px;flex-wrap:wrap}.answer{background:#edf4ee;padding:8px}#status{white-space:pre-wrap}details{margin-top:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style><main><h1>QUIZ RAID / クイズ管理</h1><div class="tools"><input type="password" id="token" autocomplete="off" placeholder="GitHubアクセストークン"><button id="connect">接続</button><button id="disconnect">切断</button></div><p><small>quiz-raid の Contents 読み書き権限を持つ専用トークンを使用。トークンはページのメモリ内だけに保持します。</small></p><div id="status">未接続</div><nav id="nav"></nav><div class="tools"><input id="search" placeholder="問題・回答・素材・タグを検索"><select id="filter"><option value="">すべての状態</option><option value="pending">承認待ち</option><option value="approved">承認済み</option><option value="rejected">却下</option></select><button id="reload">再読込</button></div><section><h2>アイデアBOX</h2><textarea id="idea" maxlength="3000" placeholder="出題したいこと、雑学、疑問を入力"></textarea><button id="post">投稿する</button><small id="postStatus"></small></section><div id="results"></div></main><script>
let rows=[],tab='items';const $=id=>document.getElementById(id);const names={items:'知識素材',questions:'問題・正答',inbox:'アイデア履歴'};function node(tag,text,cls){const e=document.createElement(tag);e.textContent=text??'';if(cls)e.className=cls;return e}
function type(r){return r.path.split('/')[2]}function state(d){return d.approval?.status||d.status||'pending'}
function render(){const counts=Object.fromEntries(Object.keys(names).map(k=>[k,rows.filter(r=>type(r)===k).length]));$('nav').replaceChildren(...Object.keys(names).map(k=>{const b=node('button',names[k]+' ('+counts[k]+')',tab===k?'active':'');b.onclick=()=>{tab=k;render()};return b}));const q=$('search').value.toLowerCase().trim(),f=$('filter').value;const selected=rows.filter(r=>type(r)===tab&&(!q||JSON.stringify(r.data).toLowerCase().includes(q))&&(!f||state(r.data)===f));$('results').replaceChildren(node('p',selected.length+' 件'));for(const r of selected){const d=r.data,a=node('article');a.append(node('small',(d.question_id||d.knowledge_id||d.id||'')+' / '+state(d)+(d.enabled===true?' / 出題有効':'')));a.append(node('h3',d.prompt||d.title||d.text||''));if(tab==='questions'){for(const o of d.options||[])a.append(node('p',o.id+' : '+o.text));const ans=d.options?.find(o=>o.id===d.answer?.value)?.text??d.answer?.value;a.append(node('p','正答：'+(typeof ans==='string'?ans:JSON.stringify(ans)),'answer'));if(d.answer?.explanation)a.append(node('p',d.answer.explanation));a.append(node('small','素材：'+d.knowledge_id+' / '+d.format+' / '+(d.tags||[]).join('、')))}else if(tab==='items'){a.append(node('p',d.canonical_fact||d.claim||''));a.append(node('small',(d.genre?.primary||'')+' / '+(d.tags||[]).join('、')));const linked=rows.filter(x=>type(x)==='questions'&&x.data.knowledge_id===d.knowledge_id);if(linked.length){const b=node('button','関連問題 '+linked.length+'件');b.onclick=()=>{tab='questions';$('search').value=d.knowledge_id;$('filter').value='';render()};a.append(b)}}else{a.append(node('p',d.created_at||''));if(d.result)a.append(node('p',typeof d.result==='string'?d.result:JSON.stringify(d.result,null,2)))}const det=node('details');det.append(node('summary','詳細データ'),node('pre',JSON.stringify(d,null,2)));a.append(det);$('results').append(a)}}
let token='', generation=0;
async function api(p,opts={},key=token){if(!key)throw Error('先にGitHubへ接続してください');const r=await fetch('https://api.github.com/repos/anmi2/quiz-raid/'+p,{...opts,credentials:'omit',cache:'no-store',headers:{Authorization:'Bearer '+key,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...opts.headers}});if(!r.ok)throw Error('GitHub HTTP '+r.status);return r.json()}
function decode(s){return new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)))}
function encode(s){return btoa(Array.from(new TextEncoder().encode(s),c=>String.fromCharCode(c)).join(''))}
async function load(){const g=++generation,key=token;try{$('status').textContent='読み込み中';const head=await api('git/ref/heads/main',{},key);const commit=await api('git/commits/'+head.object.sha,{},key);const tree=await api('git/trees/'+commit.tree.sha+'?recursive=1',{},key);if(tree.truncated)throw Error('一覧が上限を超えました');const entries=tree.tree.filter(x=>x.type==='blob'&&/^data\/knowledge\/(items\/[^/]+|questions\/[^/]+\/[^/]+|inbox\/[^/]+)\.json$/.test(x.path));const next=[];for(let i=0;i<entries.length;i+=8){if(g!==generation)return;next.push(...await Promise.all(entries.slice(i,i+8).map(async x=>({path:x.path,data:JSON.parse(decode((await api('git/blobs/'+x.sha,{},key)).content))}))));}if(g!==generation)return;rows=next;$('status').textContent='GitHub main / '+new Date().toLocaleString('ja-JP');render()}catch(e){if(g===generation)$('status').textContent='読み込み失敗：'+e.message}}
$('connect').onclick=()=>{token=$('token').value.trim();$('token').value='';rows=[];render();if(token)load()};
$('disconnect').onclick=()=>{generation++;token='';$('token').value='';rows=[];$('idea').value='';$('search').value='';$('postStatus').textContent='';$('status').textContent='未接続';render()};
$('search').oninput=render;$('filter').onchange=render;$('reload').onclick=load;
$('post').onclick=async()=>{const text=$('idea').value.trim();if(!text)return;if(!token){$('postStatus').textContent='先にGitHubへ接続してください';return}const key=token,g=generation;$('post').disabled=true;$('postStatus').textContent='保存中';try{const id='I-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+crypto.randomUUID();const data={id,text,status:'pending',created_at:new Date().toISOString(),result:null};await api('contents/data/knowledge/inbox/'+id+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Add quiz idea '+id,branch:'main',content:encode(JSON.stringify(data,null,2)+'\n')})},key);if(token!==key)return;generation++;rows=rows.filter(r=>r.data.id!==id);rows.unshift({path:'data/knowledge/inbox/'+id+'.json',data});$('idea').value='';$('postStatus').textContent='投稿済み・整理待ち';tab='inbox';$('search').value='';$('filter').value='';$('status').textContent='GitHub 保存済み / '+new Date().toLocaleString('ja-JP');render()}catch(e){if(token===key)$('postStatus').textContent='保存失敗：'+e.message}finally{$('post').disabled=false}};render();
</script></html>
