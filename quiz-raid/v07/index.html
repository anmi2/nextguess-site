<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QUIZ RAID — Online Room Test</title><style>
*{box-sizing:border-box}body{margin:0;background:#111a25;color:#edf3f4;font-family:system-ui,sans-serif}.wrap{max-width:730px;margin:auto;padding:18px}button,input,select{font:inherit;padding:10px;border-radius:8px}button{background:#e0c283;border:0;color:#181c21;font-weight:700;cursor:pointer}input,select{background:#1c2d38;color:#f7f8f8;border:1px solid #657684}button:disabled{opacity:.45}.card{background:#20303e;border:1px solid #4b6172;border-radius:12px;padding:18px;margin:12px 0}.fields{display:flex;gap:8px;flex-wrap:wrap}.fields label{display:grid;gap:4px;flex:1;min-width:110px}.fields input,.fields select{width:100%;min-width:0}.fields label{min-width:0}.room-actions{display:grid;grid-template-columns:1fr;gap:14px;margin-top:18px}.join-panel,.create-panel{display:grid;gap:9px;min-width:0}.room-actions label{display:grid;gap:6px;min-width:0}.room-actions input{width:100%;min-width:0}.room-actions button{width:100%;min-height:48px}.create-panel{padding-bottom:14px;border-bottom:1px solid #566b7b}@media(min-width:680px){.room-actions{grid-template-columns:1fr 1fr}.create-panel{padding:0 16px 0 0;border-bottom:0;border-right:1px solid #566b7b;align-content:start}}.fields{align-items:end}.fields button{align-self:end}.muted,small{color:#b4c7d3}.bar{height:18px;background:#0a131c;border-radius:10px;overflow:hidden}.bar>div{height:100%;background:#bd826e;transition:width .2s}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.options button{text-align:left;background:#344c62;color:white;min-height:65px;border:1px solid #5f768c}#code{font-weight:900;font-size:29px;letter-spacing:.16em;color:#edcf8c}#party{line-height:1.9}.hidden{display:none}@media(max-width:480px){.options{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><h1>QUIZ RAID — 2端末接続テスト</h1><p class="muted">Macで部屋を作成 → スマホでコードを入力して参加。ゾンビHPとクイズを同期する初期版です。</p><div class="card"><label>サーバーURL <input id="server" style="width:100%" value="https://quiz-raid-production-gjoc8a.laravel.cloud" spellcheck="false"></label><p class="muted">接続先はQuiz Raidの公開サーバーに設定済みです。</p><div class="fields"><label>名前<input id="name" maxlength="20" value="PLAYER"></label><label>職業<select id="role"><option value="0">戦士</option><option value="1">魔導士</option><option value="2">僧侶</option><option value="3">吟遊詩人</option></select></label></div><div class="room-actions"><div class="create-panel"><strong>新しい部屋を作る</strong><button id="create">ルーム作成</button></div><div class="join-panel"><strong>既存の部屋に参加</strong><label for="joincode">Mac側に表示された参加コード（6文字）<input id="joincode" maxlength="6" placeholder="例：A1B2C3" autocomplete="off" autocapitalize="characters" spellcheck="false" style="font-size:20px;letter-spacing:.12em"></label><button id="join">コードで参加</button></div></div><p id="status" aria-live="polite"></p></div>
<div class="card hidden" id="room"><div class="fields"><div>ROOM CODE<div id="code"></div></div><button id="copy">コードをコピー</button><button id="leave">退出</button></div><h2>Zombie <span id="ehp"></span></h2><div class="bar"><div id="enemybar"></div></div><p>共通HP <b id="php"></b></p><div class="bar"><div id="partybar" style="background:#9dc6a9"></div></div><p id="party"></p><h2 id="question"></h2><div class="options" id="answers"></div><p id="result"></p><small>初期テスト：クイズ回答、共通HP、敵HP、参加者枠の同期のみ。NPCの自動スキル・制限時間・救援は次段階。</small></div></main><script>
const $=id=>document.getElementById(id);let token='',roomId='',stream=null,questionId=-1,finished=false;
const base=()=>($('server').value||'').trim().replace(/\/+$/,'');
function status(msg){$('status').textContent=msg}
async function api(path,data){if(!base())throw Error('サーバーURLを入力してください');const res=await fetch(base()+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const obj=await res.json();if(!res.ok)throw Error(obj.error||'request failed '+res.status);return obj;}
function show(room){if(!room)return;roomId=room.id;questionId=room.question.id;finished=!!room.finished;$('room').classList.remove('hidden');$('code').textContent=room.id;$('ehp').textContent=room.enemyHp+' / '+room.enemyMax;$('enemybar').style.width=100*room.enemyHp/room.enemyMax+'%';$('php').textContent=room.partyHp+' / '+room.partyMax;$('partybar').style.width=room.partyHp+'%';$('party').textContent=room.roles.map((x,i)=>['戦士','魔導士','僧侶','吟遊詩人'][i]+': '+x).join(' / ');$('question').textContent=room.finished?(room.finished==='victory'?'VICTORY!':'DEFEAT'):room.question.text;$('answers').replaceChildren();if(!room.finished)room.question.options.forEach((opt,i)=>{let btn=document.createElement('button');btn.textContent=(i+1)+'. '+opt;btn.onclick=async()=>{Array.from($('answers').children).forEach(x=>x.disabled=true);try{const r=await api('/api/rooms/'+roomId+'/answer',{token,questionId,answer:i});$('result').textContent=r.correct?'正解！':'不正解';show(r.room);}catch(e){status(e.message);}};$('answers').append(btn);});}
function listen(){if(stream)stream.close();stream=new EventSource(base()+'/api/rooms/'+roomId+'/events?token='+encodeURIComponent(token));stream.onmessage=e=>{show(JSON.parse(e.data));status('同期中：接続済み');};stream.onerror=()=>status('接続確認中・再接続を試行しています');}
async function attach(fn){try{const result=await fn();token=result.token;show(result.room);listen();}catch(e){status('エラー: '+e.message)}}
$('create').onclick=()=>attach(()=>api('/api/rooms',{name:$('name').value,role:Number($('role').value)}));
$('join').onclick=()=>{const code=$('joincode').value.trim().toUpperCase();if(!/^[A-F0-9]{6}$/.test(code)){status('参加コードはMacに表示された英数字6文字を入力してください。');$('joincode').focus();return;}attach(()=>api('/api/rooms/'+code+'/join',{name:$('name').value,role:Number($('role').value)}));};
$('copy').onclick=()=>navigator.clipboard?.writeText(roomId);
$('leave').onclick=async()=>{try{await api('/api/rooms/'+roomId+'/leave',{token})}catch{}if(stream)stream.close();stream=null;token='';roomId='';$('room').classList.add('hidden');status('退出しました')};
</script></body></html>
