.terrain-accent{border-color:var(--terrain-accent)!important}

#slash::after{width:62%;left:23%;top:43%;height:3px;transform:rotate(-44deg);opacity:.88}

function t(k){return (words[language][k]||k)}
function set(id,txt){$(id).textContent=txt}
let stored;
try{stored=JSON.parse(localStorage.getItem(progressKey)||'{}')}catch{stored={}}
let progress={pt:Number(stored.pt)||0,clears:Number(stored.clears)||0,lastClear:stored.lastClear||'',claimed:stored.claimed||''};
function save(){localStorage.setItem(progressKey,JSON.stringify(progress));}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
let terrain=localStorage.getItem('qr_v06_terrain')||'forest';if(!['forest','swamp','plains','island','mountain'].includes(terrain))terrain='forest';
function terrainApply(){document.body.dataset.terrain=terrain;$('terrainSelect').value=terrain;localStorage.setItem('qr_v06_terrain',terrain);}
function feedbackFX(correct){const box=$('feedback');box.classList.remove('correct-answer','wrong-answer');void box.offsetWidth;box.classList.add(correct?'correct-answer':'wrong-answer');set('feedback',language==='ja'?(correct?'正解！ 敵にダメージ！':'不正解！ 共通HP減少'):(correct?'CORRECT! Enemy hit!':'WRONG! Shared HP damaged!'));const el=$(correct?'slash':'hpBar');const p=$('partyHP');el.classList.remove('slashing','hpwrong');p.classList.remove('hpwrong');void el.offsetWidth;el.classList.add(correct?'slashing':'hpwrong');if(!correct)p.classList.add('hpwrong');}
let page='Class',selectedClass=0,selectedQuest=0,battle=null,last=0,raf=0,qCursor=-1,questionNo=0;
const pages=['Class','Skill','Quest','Battle','Between','Result','Lobby'];
function show(p){page=p;pages.forEach(n=>{$('page'+n).classList.toggle('hidden',n!==p)});renderSteps();if(p==='Skill')renderSkills();if(p==='Quest')renderQuests();if(p==='Lobby')renderLobby();window.scrollTo(0,0);}
function renderSteps(){const step={Class:0,Skill:1,Quest:2,Battle:3,Between:3,Result:4,Lobby:5}[page];$('steps').replaceChildren();words[language].steps.forEach((s,i)=>{const a=document.createElement('div');a.textContent=(i+1)+'. '+s;a.className='step '+(i<step?'done':i===step?'active':'');$('steps').append(a);});}
function renderClasses(){$('classes').replaceChildren();classes.forEach((c,i)=>{const b=document.createElement('button');b.className='choice'+(i===selectedClass?' selected':'');const title=document.createElement('strong');title.textContent=c.name[language];const sub=document.createElement('span');sub.textContent=c.skill+' — '+c.desc[language];b.append(title,sub);b.onclick=()=>{selectedClass=i;renderClasses();};$('classes').append(b);});}
function renderSkills(){$('skills').replaceChildren();const c=classes[selectedClass];for(let i=0;i<3;i++){const el=document.createElement('div');el.className='skillitem'+(i===0?' active':' locked');const h=document.createElement('strong');h.textContent=i===0?c.skill:t('lockedName')+' '+i;const p=document.createElement('small');p.textContent=i===0?c.desc[language]+' · '+t('available'):t('locked');el.append(h,p);$('skills').append(el);}}
function renderQuests(){$('quests').replaceChildren();quests.forEach((q,i)=>{const b=document.createElement('button');b.className='choice'+(i===selectedQuest?' selected':'');const h=document.createElement('strong');h.textContent='★☆☆☆☆ '+q[language];const sub=document.createElement('span');sub.textContent=t(q.desc);b.append(h,sub);b.onclick=()=>{selectedQuest=i;renderQuests();};$('quests').append(b);});}
function clock(n){n=Math.max(0,Math.floor(n));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}
function drawMonster(kind){const canvas=$('sprite'),c=canvas.getContext('2d');c.clearRect(0,0,48,48);c.imageSmoothingEnabled=false;
const r=(x,y,w,h,color)=>{c.fillStyle=color;c.fillRect(x,y,w,h);};
if(kind===0||kind===1){
const base=kind===0?'#72c9a3':'#bca5d9',shade=kind===0?'#468a76':'#8169a4',light=kind===0?'#9be5c1':'#e5d7f6';
r(10,28,28,12,shade);r(13,18,22,22,base);r(17,13,14,26,base);r(20,9,8,32,base);r(14,25,20,8,light);r(17,25,4,5,'#23383f');r(27,25,4,5,'#23383f');r(21,34,6,2,'#34515b');r(12,38,24,4,'#335b58');}
else {r(9,7,9,12,'#5c655f');r(30,7,9,12,'#5c655f');r(12,13,24,25,'#717c76');r(8,19,32,14,'#717c76');r(17,22,4,5,'#f4dbaa');r(27,22,4,5,'#f4dbaa');r(18,24,3,3,'#313639');r(28,24,3,3,'#313639');r(21,30,6,5,'#443d3d');r(13,37,9,5,'#4a5250');r(26,37,9,5,'#4a5250');r(18,10,12,7,'#87918b');}
}
function effect(txt,attack){set('fx',txt);const node=$('sprite');node.classList.remove('hit','attack');void node.offsetWidth;node.classList.add(attack?'attack':'hit');}
function makeParty(){$('party').replaceChildren();classes.forEach((c,i)=>{const box=document.createElement('div');box.className='seat';box.style.setProperty('--g',c.color);const name=document.createElement('strong');name.textContent=c.name[language];const note=document.createElement('small');note.textContent=(i===selectedClass?t('player'):t('npc'))+' · '+c.skill;const gauge=document.createElement('div');gauge.className='gauge';const fill=document.createElement('div');fill.id='atb'+i;gauge.append(fill);box.append(name,note,gauge);$('party').append(box);});}
function startQuest(){cancelAnimationFrame(raf);battle={quest:quests[selectedQuest],enemyIndex:0,enemyHp:0,enemyMax:0,partyHp:100,attackLeft:12,qLeft:22,charges:[0,0,0,0],haste:0,elapsed:0,damage:0,partyDamage:0,correct:0,mistakes:0,phase:'idle',resultPt:0};questionNo=0;qCursor=Math.floor(Math.random()*quiz.length);makeParty();beginEnemy();}
function beginEnemy(){set('feedback','');$('feedback').classList.remove('correct-answer','wrong-answer');const b=battle,e=enemies[b.quest.list[b.enemyIndex]];b.enemyHp=e.hp;b.enemyMax=e.hp;b.attackLeft=e.attack;b.qLeft=22;b.phase='battle';drawMonster(e.kind);set('enemyName',e.name[language]);set('fx','');nextQuestion();show('Battle');last=performance.now();raf=requestAnimationFrame(tick);renderBattle();}
function nextQuestion(){const b=battle;if(!b||b.phase!=='battle')return;qCursor=(qCursor+1)%quiz.length;const q=quiz[qCursor];b.qLeft=22;set('question',q[language]);$('answers').replaceChildren();q[language+'A'].forEach((value,i)=>{const btn=document.createElement('button');btn.textContent=String.fromCharCode(65+i)+'. '+value;btn.onclick=()=>answer(i);$('answers').append(btn);});questionNo++;}
function stageWin(){const b=battle;b.phase='between';cancelAnimationFrame(raf);if(b.enemyIndex+1<b.quest.list.length){show('Between');set('betweenDesc',t('betweenDesc'));}else finish(true);}
function finish(success){const b=battle;b.phase='done';cancelAnimationFrame(raf);b.resultPt=success?(12*b.quest.list.length+3*b.correct):0;if(success){progress.pt+=b.resultPt;progress.clears++;progress.lastClear=today();save();}
set('resultTitle',success?t('resultTitle'):t('resultFail'));set('resultDesc',success?t('resultDesc'):t('failDesc'));set('rDamage',b.damage);set('rTime',clock(b.elapsed));set('rCorrect',b.correct);set('rPt','+'+b.resultPt);show('Result');}
function nextStage(){battle.enemyIndex++;battle.partyHp=100;beginEnemy();}
function hurt(n){battle.partyHp=Math.max(0,battle.partyHp-n);if(battle.partyHp<=0)finish(false);}
function skill(i){const b=battle;if(i===0){const dmg=30;b.enemyHp=Math.max(0,b.enemyHp-dmg);b.partyDamage+=dmg;if(i===selectedClass)b.damage+=dmg;effect('BASH −'+dmg,false);}
if(i===1){b.attackLeft+=5;effect('FREEZE +5s',false);}
if(i===2){const recovered=Math.min(100-b.partyHp,20);b.partyHp+=recovered;effect('HEAL +'+recovered,false);}
if(i===3){b.haste=12;effect('HASTE +40%',false);}
if(b.enemyHp<=0)stageWin();}
function answer(i){const b=battle;if(!b||b.phase!=='battle')return;const q=quiz[qCursor];
if(i===q.a){feedbackFX(true);const d=20;b.enemyHp=Math.max(0,b.enemyHp-d);b.damage+=d;b.partyDamage+=d;b.correct++;effect(t('correct')+' −'+d,false);if(b.enemyHp<=0){stageWin();renderBattle();return;}}
else{feedbackFX(false);hurt(8);b.mistakes++;b.charges[selectedClass]=Math.max(0,b.charges[selectedClass]-.3);effect(t('wrong')+' −8 HP',true);if(b.phase!=='battle')return;}
nextQuestion();renderBattle();}
function tick(now){const b=battle;if(!b||b.phase!=='battle')return;const dt=Math.min((now-last)/1000,.15);last=now;b.elapsed+=dt;b.qLeft-=dt;b.attackLeft-=dt;const boosted=b.haste>0;b.haste=Math.max(0,b.haste-dt);
if(b.qLeft<=0){set('feedback',t('timeOut'));nextQuestion();}
if(b.attackLeft<=0){const e=enemies[b.quest.list[b.enemyIndex]];b.attackLeft+=e.attack;hurt(e.strike);effect('−'+e.strike+' HP',true);if(b.phase!=='battle'){renderBattle();return;}}
for(let i=0;i<4;i++){if(b.phase!=='battle')break;b.charges[i]+=dt*(boosted?1.4:1)/classes[i].cd;if(b.charges[i]>=1){b.charges[i]-=1;skill(i);}}
renderBattle();if(b.phase==='battle')raf=requestAnimationFrame(tick);}
function renderBattle(){const b=battle;if(!b)return;set('wave',(b.enemyIndex+1)+' / '+b.quest.list.length);set('enemyHP',Math.ceil(b.enemyHp)+' / '+b.enemyMax);
$('enemyBar').style.width=Math.max(0,100*b.enemyHp/b.enemyMax)+'%';set('partyHP',Math.ceil(b.partyHp)+' / 100');$('hpBar').style.width=Math.max(0,b.partyHp)+'%';
$('questionBar').style.width=Math.max(0,100*b.qLeft/22)+'%';set('questionTime',Math.max(0,b.qLeft).toFixed(1)+'s');
set('enemyTimer',t('enemyStrike')+': '+Math.max(0,b.attackLeft).toFixed(1)+'s');
for(let i=0;i<4;i++){const atb=$('atb'+i);if(atb)atb.style.width=Math.max(0,Math.min(100,b.charges[i]*100))+'%';}}
function renderLobby(){set('lPt',progress.pt);set('lClears',progress.clears);const eligible=progress.lastClear===today(),already=progress.claimed===today();$('claim').disabled=!eligible||already;set('claim',already?t('claimed'):!eligible?t('notEligible'):t('claim'));set('dailyStatus',already?t('claimed'):'');set('registerText',progress.clears>=3?t('registerReady'):t('registerMore'));}
function claimBonus(){if(progress.lastClear!==today()||progress.claimed===today())return;progress.pt+=10;progress.claimed=today();save();renderLobby();set('dailyStatus',t('claimedNow'));}
function translate(){
document.documentElement.lang=language;localStorage.setItem(languageKey,language);set('terrainLabel',language==='ja'?'背景テーマ':'SCENERY');
const simple=['classTitle','classDesc','classTip','guestNote','toSkill','skillTitle','skillDesc','skillTip','toQuest','questTitle','questDesc','questTip','toBattle','battleTitle','hpLabel','questionLabel','battleTip','pass','restart','betweenTitle','betweenDesc','betweenTip','nextEnemy','rDamageLabel','rTimeLabel','rCorrectLabel','rPtLabel','resultTip','playAgain','toLobby','lobbyTitle','lobbyDesc','lPtLabel','lClearsLabel','dailyTitle','dailyText','coopTitle','coopText','coopButton','registerTitle','registerButton','lobbyTip','newTutorial','lobbyLink','disclaimer'];
simple.forEach(id=>set(id,t(id)));set('backClass',t('back'));set('backSkill',t('back'));renderClasses();if(page==='Skill')renderSkills();if(page==='Quest')renderQuests();if(battle&&page==='Battle'){makeParty();set('enemyName',enemies[battle.quest.list[battle.enemyIndex]].name[language]);nextQuestion();renderBattle();}
if(page==='Lobby')renderLobby();renderSteps();
}
$('terrainSelect').onchange=()=>{terrain=$('terrainSelect').value;terrainApply();};terrainApply();
$('language').onclick=()=>{language=language==='ja'?'en':'ja';translate();};
$('toSkill').onclick=()=>show('Skill');$('backClass').onclick=()=>show('Class');$('toQuest').onclick=()=>show('Quest');$('backSkill').onclick=()=>show('Skill');$('toBattle').onclick=startQuest;
$('nextEnemy').onclick=nextStage;$('pass').onclick=()=>{if(battle?.phase==='battle')nextQuestion();};$('restart').onclick=startQuest;
$('playAgain').onclick=()=>show('Class');$('toLobby').onclick=()=>show('Lobby');$('newTutorial').onclick=()=>show('Class');$('claim').onclick=claimBonus;
translate();show('Class');
</script></body></html>
