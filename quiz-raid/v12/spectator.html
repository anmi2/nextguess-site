<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QUIZ RAID · Spectator v0.11</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#eaf2f2;background:#0d151e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 55% 8%,#31503d,#101a25 70%);overflow:hidden}.stage{width:100vw;height:100dvh;min-height:390px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:1.5vh;padding:2.5vh 3vw}.top{display:flex;align-items:center;justify-content:space-between}.logo{font-size:clamp(20px,2.7vw,48px);font-weight:900;letter-spacing:.1em;color:#e9c981}.sub{font-size:clamp(11px,1.15vw,21px);letter-spacing:.17em;color:#bcd2d1}.battle{display:grid;grid-template-columns:50% 50%;min-height:0;background:linear-gradient(135deg,#1b2c32cc,#1b2f30cc);border:1px solid #456353;border-radius:2vh;padding:2vw}.monster{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2vh}.creature{font-size:min(29vh,21vw);line-height:1;filter:drop-shadow(0 20px 11px #0008)}.name{font-size:clamp(19px,2.7vw,44px);font-weight:800}.meter{height:1.4vh;min-height:7px;border-radius:99px;overflow:hidden;background:#0b131a;width:90%}.meter div{height:100%;background:#d98475;transition:width .25s}.meter.party div{background:#88c7a2}.hp{font-size:clamp(13px,1.25vw,23px);color:#c6d8dc}.right{display:flex;flex-direction:column;gap:2.2vh;padding:1vw 2vw;justify-content:center}.qtitle{color:#e2c889;font-size:clamp(15px,1.6vw,29px);letter-spacing:.07em}.question{font-size:clamp(23px,3vw,54px);font-weight:800;line-height:1.28;min-height:5em;overflow-wrap:break-word}.sceneStatus{font-size:clamp(13px,1.3vw,24px);color:#e1c58d}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:2vw}.footerCard{padding:1vw 1.5vw;background:#182731;border:1px solid #364c54;border-radius:1.2vh}.row{display:flex;justify-content:space-between;gap:10px}.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.slot{border:1px solid #456069;padding:6px;border-radius:8px;text-align:center;font-size:clamp(10px,1vw,19px)}.slot b{display:block}.quiet{font-size:clamp(11px,1vw,19px);color:#a4bdc5}.circle{font-size:clamp(16px,1.6vw,29px);font-weight:750;color:#e7c67f}@media(max-aspect-ratio:1/1){.stage{padding:2vh 2vw}.battle{grid-template-columns:1fr;grid-template-rows:45% 55%}.creature{font-size:14vh}.question{font-size:4vw;min-height:0}.bottom{grid-template-columns:1fr}.slots{margin-top:5px}}
</style></head><body><div class="stage"><header class="top"><div class="logo">QUIZ RAID</div><div class="sub">LIVE BATTLE · SPECTATOR</div></header><div class="battle"><div class="monster"><div class="creature" aria-hidden="true">🧟</div><div class="name" id="enemy">Zombie</div><div class="meter"><div id="enemyBar"></div></div><div class="hp" id="enemyHp"></div></div><div class="right"><div class="qtitle">QUESTION <span id="number">—</span> · LIVE REVEAL</div><div class="question" id="question">Waiting for room…</div><div class="sceneStatus" id="last"></div></div></div><div class="bottom"><div class="footerCard"><div class="row"><strong>PARTY</strong><span class="hp" id="php">—</span></div><div class="meter party"><div id="partyBar"></div></div><div class="slots" id="slots"></div></div><div class="footerCard"><div class="row"><strong>BATTLE FEED</strong><span id="connection" class="quiet">Connecting…</span></div><p id="status" class="circle">Watch-only mode</p><div class="quiet">No controls, no answer key, no player access token · Open Beta preview</div></div></div></div>
<script>
'use strict';const $=id=>document.getElementById(id);const p=new URLSearchParams(location.search);const id=p.get('room'),key=p.get('key');const root='https://quiz-raid-production-gjoc8a.laravel.cloud';let state=null,stream=null,lastRev=-1;
function paint(){if(!state)return;$('enemy').textContent=state.enemy;$('enemyHp').textContent=state.enemyHp+' / '+state.enemyMax;$('enemyBar').style.width=(100*state.enemyHp/state.enemyMax)+'%';$('php').textContent=state.partyHp+' / '+state.partyMax;$('partyBar').style.width=(100*state.partyHp/state.partyMax)+'%';$('number').textContent=state.question.id+1;
if(state.finished){$('question').textContent=state.finished.toUpperCase();$('status').textContent='BATTLE '+state.finished.toUpperCase();return}
const q=state.question;const elapsed=Math.max(0,Date.now()-q.startedAt);const n=Math.min(q.text.length,Math.floor(elapsed/(q.letterIntervalMs||85)));$('question').textContent=q.text.slice(0,n)+(n<q.text.length?'▌':'');$('status').textContent=n<q.text.length?'Question revealing…':'Answering…';
}
function render(r){state=r;$('slots').replaceChildren();for(let i=0;i<4;i++){const who=r.players.find(x=>x.role===i),node=document.createElement('div');node.className='slot';const label=document.createElement('b');label.textContent=['WARRIOR','MAGE','CLERIC','BARD'][i];const info=document.createElement('span');info.textContent=who?'PLAYER · '+who.damage:'NPC';node.append(label,info);$('slots').append(node)}if(r.lastAnswer){$('last').textContent=(r.lastAnswer.correct?'CORRECT':'WRONG')+' · Last answer received'}else{$('last').textContent='Waiting for an answer'}paint()}
if(!/^[A-F0-9]{6}$/.test(id||'')||!/^[a-f0-9]{32}$/.test(key||'')){$('question').textContent='Invalid spectator link';$('connection').textContent='No access'}else{
 stream=new EventSource(root+'/api/rooms/'+id+'/spectate?key='+encodeURIComponent(key));stream.onmessage=e=>{try{render(JSON.parse(e.data));$('connection').textContent='LIVE · CONNECTED'}catch{$('connection').textContent='Invalid stream data'}};stream.onerror=()=>{$('connection').textContent='Connecting / unavailable';if(!state)$('question').textContent='Stream not available. Check server deployment and watch link.'};
 setInterval(paint,85);
}
</script></body></html>
